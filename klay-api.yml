        Foundation for owner restock decisions and downstream AI insights.
      x-klay-flag:
        kind: not-implemented
        note: "Returns empty entries[]; consumption_log not implemented (handler_report.go). ingredient query param is ignored."
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: start_date, in: query, required: true, schema: { type: string, format: date } }
        - { name: end_date, in: query, required: true, schema: { type: string, format: date } }
        - { name: ingredient, in: query, schema: { type: string }, description: Filter by ingredient name (ignored by server) }
      responses:
        '200':
          description: Consumption report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/ConsumptionReport' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /metrics/reports/export:
    post:
      tags: [Metrics]
      summary: Export report to PDF or CSV
      description: >
        Generates a file download. Server returns a temporary URL or streams directly.
        Report type and period are passed via body.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, format, period]
              properties:
                type:
                  type: string
                  enum: [daily_sales, monthly_sales, consumption]
                format:
                  type: string
                  enum: [pdf, csv]
                period:
                  type: object
                  description: Shape depends on type. Daily=date, monthly=month, consumption=start_date+end_date.
                  additionalProperties: true
      responses:
        '200':
          description: File generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      download_url: { type: string, format: uri }
                      expires_at: { type: string, format: date-time }
                      filename: { type: string }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Invalid type, format, or period combination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /metrics/insight:
    get:
      tags: [Metrics]
      summary: List insight cards
      description: >
        Rule-based MVP. Schema is ready for model_version + confidence
        if later switching to an AI engine.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Insight cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InsightCard' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==========================================================
  # ADMIN (SKALAR STAFF)
  # ==========================================================
  # Every /admin/owners, /admin/products, /admin/transactions route below
  # (reads AND writes) requires BearerAuth (admin JWT, role=admin) — issued
  # by POST /admin/auth/google after a server-side Google OAuth + whitelist
  # check (core/adminauth). audit_logs.admin_email always has a real
  # per-admin identity.
  #
  # No shared-secret API key: an earlier design gated reads with a static
  # X-Admin-Key, sent from the klay-admin browser bundle — but Vite inlines
  # VITE_* env vars at build time, so that key was extractable from the
  # deployed JS and bypassed the whitelist entirely for reads. Removed.
  # ==========================================================

  /admin/auth/google:
    post:
      tags: [Admin]
      summary: Admin Skalar login via Google OAuth
      description: >
        core/adminauth. Frontend gets a Google ID token (credential) from
        Google Sign-In and posts it here. Server verifies the token against
        Google (signature + audience == GOOGLE_CLIENT_ID), extracts the
        verified email, and checks it against ADMIN_WHITELIST_EMAILS (env
        var, comma-separated — no DB table, parsed once into an in-memory
        set). No match -> 403, no token issued. Match -> admin JWT issued
        (access_token in body, refresh token via httpOnly
        "admin_refresh_token" cookie — separate cookie name from
        owner/operator's "refresh_token" so sessions can't collide if both
        panels share a browser/cookie domain). Logs admin.login to
        audit_logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: Google ID token from Google Sign-In. }
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      admin: { $ref: '#/components/schemas/AdminUser' }
                  error: { type: string, nullable: true }
        '400':
          description: Empty credential or invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Invalid Google token (signature/audience/expiry verification failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Email not in ADMIN_WHITELIST_EMAILS. No token issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/auth/refresh:
    post:
      tags: [Admin]
      summary: Refresh admin access token
      x-klay-flag:
        kind: not-implemented
        note: >
          Not built in phase 0 — out of the endpoint list phase-0.md asked
          for (only google/me/logout). admin_refresh_tokens rows ARE stored
          on login and deletable on logout, so the storage side is ready;
          only the redemption endpoint is missing. Until this exists, admin
          sessions expire with JWT_ACCESS_EXPIRY (15m default) and require
          a fresh Google sign-in — no silent refresh. Backlog for a later
          phase.
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/auth/logout:
    post:
      tags: [Admin]
      summary: Admin logout
      description: >
        core/adminauth. Public — no Bearer required (same pattern as owner
        /auth/logout): reads the admin_refresh_token cookie, best-effort
        deletes it server-side, always clears the cookie. Idempotent —
        calling it with no cookie still returns 200.
      responses:
        '200':
          description: Logout successful (idempotent, also when there is no active session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleSuccess' }

  /admin/auth/me:
    get:
      tags: [Admin]
      summary: Identity of the admin from the active session
      description: >
        core/adminauth. Used by the FE to check the session. Pure JWT-claims
        read, no DB call — email and name both come from the
        Google-verified token at login time and are embedded in the JWT
        itself (there's no admin identity row to look up). Reflects
        whatever Google returned at login, not live data — if an admin's
        Google profile name changes, /me won't show it until they log in
        again.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Admin profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AdminUser' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---- Admin: Business management ----

  /admin/owners:
    get:
      tags: [Admin]
      summary: List all owners (cross-merchant)
      description: >
        Admin view. handler.ListOwners — accepts only page and limit.
        Status/plan/q filters are not processed by the server (admin/handler.go).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Paginated owner list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/OwnerListResult' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Admin]
      summary: Onboard a new merchant
      description: >
        Creates Business + User owner in one operation. Body matches admin/model.go
        CreateBusinessRequest. business_id is server-generated.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBusinessRequest' }
      responses:
        '201':
          description: Owner onboarded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/OwnerDetail' }
                  error: { type: string, nullable: true }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Owner email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/owners/{owner_id}:
    parameters:
      - { name: owner_id, in: path, required: true, schema: { type: string, format: uuid } }

    get:
      tags: [Admin]
      summary: Owner details
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Owner details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/OwnerDetail' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Admin]
      summary: Update business info owner (admin-controlled fields)
      description: >
        Matches admin/model.go UpdateBusinessRequest. Fields not sent remain unchanged.
        merchant_status enum: PENDING | REGISTERED | ACTIVE | SUSPENDED.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBusinessRequest' }
      responses:
        '200':
          description: Owner updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/OwnerDetail' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/owners/{owner_id}/status:
    patch:
      tags: [Admin]
      summary: Toggle aktif/suspend owner
      description: >
        handler.SetOwnerStatus — boolean toggle. enabled=true activates,
        enabled=false suspends. Returns HTTP 200 { success: true } via response.NoContent().
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: owner_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: "true = activate, false = suspend"
      responses:
        '200':
          description: Status toggled. response.NoContent() returns HTTP 200 { success:true }.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/owners/{owner_id}/credential:
    post:
      tags: [Admin]
      summary: Set owner login credentials (email and/or password)
      description: >
        handler.SetOwnerCredential. email is optional (must be valid format if provided).
        password is required, min 6 characters. Returns HTTP 200 { success:true } via response.NoContent().
      security: [{ BearerAuth: [] }]
      x-klay-flag:
        kind: undocumented
        note: "Route present in admin/routes.go but absent from prior contract."
      parameters:
        - { name: owner_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email:
                  type: string
                  format: email
                  nullable: true
                  description: Optional. Must be a valid email format if provided.
                password:
                  type: string
                  format: password
                  minLength: 6
                  description: Required, minimum 6 characters.
      responses:
        '200':
          description: Credentials updated. response.NoContent() returns HTTP 200 { success:true }.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Admin: Product management (CRUD penuh per business) ----

  /admin/owners/{owner_id}/products:
    parameters:
      - { name: owner_id, in: path, required: true, schema: { type: string, format: uuid } }

    get:
      tags: [Admin]
      summary: List products for the business
      description: >
        handler.ListOwnerProducts. Response wraps products inside an object
        { products: [...] } (not a direct array).
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items: { $ref: '#/components/schemas/AdminProduct' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [Admin]
      summary: Add a product for the business
      description: >
        handler.CreateProduct. Body matches admin/model.go AdminCreateProductRequest.
        business_id is taken from the path param, not the body.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCreateProductRequest' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AdminProduct' }
                  error: { type: string, nullable: true }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/products/{product_id}:
    parameters:
      - { name: product_id, in: path, required: true, schema: { type: string, format: uuid } }

    get:
      tags: [Admin]
      summary: Product details (including recipe)
      description: handler.GetProduct. Returns AdminProductDetail which includes the recipe array.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Product details with recipe
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AdminProductDetail' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Admin]
      summary: Update produk (partial)
      description: >
        handler.UpdateProduct. Body matches admin/model.go AdminUpdateProductRequest.
        All fields are optional (pointer) — fields not sent remain unchanged.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateProductRequest' }
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AdminProduct' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Admin]
      summary: Delete product
      description: >
        handler.DeleteProduct. Soft delete if product already exists in historical transactions.
        Returns HTTP 200 { success:true } via response.NoContent() (NOT 204).
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/products/{product_id}/recipe:
    put:
      tags: [Admin]
      summary: Replace recipe produk
      description: >
        handler.UpdateProductRecipe. Replaces the entire recipe array (not a merge).
        Returns HTTP 200 { success:true } via response.NoContent() (NOT 204).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe]
              properties:
                recipe:
                  type: array
                  items: { $ref: '#/components/schemas/Ingredient' }
                  description: New ingredient array. Replaces the entire existing recipe.
      responses:
        '200':
          description: Recipe updated. response.NoContent() returns HTTP 200 { success:true }.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleSuccess' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Admin: Operator removal (on request) ----

  /admin/owners/{owner_id}/operators/{operator_id}:
    delete:
      tags: [Admin]
      summary: Remove operator on merchant request
      description: >
        handler.DeleteOperator. Admin can only REMOVE operator on request.
        No request body — handler does not read body (admin/handler.go).
        Returns HTTP 200 { success:true } via response.NoContent() (NOT 204).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: owner_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: operator_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Operator removed. response.NoContent() returns HTTP 200 { success:true }.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Admin: Transaction cross-merchant view + void ----

  /admin/transactions:
    get:
      tags: [Admin]
      summary: List transaksi cross-merchant
      description: >
        handler.ListTransactions. Filter yang diproses: status (string), business_id (uuid),
        start_date (YYYY-MM-DD, filter created_at >= start), end_date (YYYY-MM-DD, filter created_at < end+1day),
        page (default 1), limit (default 20, max 100).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string }, description: "Filter status transaksi (string bebas, tidak divalidasi enum di handler)." }
        - { name: business_id, in: query, schema: { type: string, format: uuid }, description: Filter per business. }
        - { name: start_date, in: query, schema: { type: string, format: date }, description: "Format YYYY-MM-DD. created_at >= start_date." }
        - { name: end_date, in: query, schema: { type: string, format: date }, description: "Format YYYY-MM-DD. created_at < end_date + 1 hari." }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: List transaksi cross-merchant berpaginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AdminListTransactionsResult' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/transactions/{transaction_id}/void:
    post:
      tags: [Admin]
      summary: Void transaksi (admin)
      description: >
        handler.VoidTransaction. Tidak ada request body — handler tidak membaca body.
        Returns HTTP 200 { success:true } via response.NoContent() (BUKAN 204).
        409 dikembalikan jika transaksi bukan status PENDING/CONFIRMED (tidak bisa di-void).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: transaction_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Transaksi di-void. response.NoContent() returns HTTP 200 { success:true }.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transaction cannot be voided (already VOIDED or invalid status)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---- Admin: read-only SQL console ----

  /admin/query:
    post:
      tags: [Admin]
      summary: Run a single read-only SELECT query (SQL console)
      description: >
        core/adminquery. Guarded, not a general SQL endpoint: rejects
        anything that isn't a single SELECT/WITH statement (write CTEs,
        SELECT ... INTO, FOR UPDATE/SHARE, dangerous function calls like
        pg_terminate_backend, and multi-statement input via ';' are all
        rejected before reaching the database). Executes inside a Postgres
        READ ONLY transaction as a second, DB-enforced layer beyond the
        text guard, with SET LOCAL statement_timeout=5s and the query
        outer-wrapped in "SELECT * FROM (...) LIMIT 1000" so returned rows
        are bounded regardless of what the inner query requested. Every
        submitted query is audit-logged (action: admin.query, query text +
        outcome in metadata) — including ones the guard blocked, since a
        blocked destructive attempt is itself worth having on record.
        Errors (guard rejection or a real Postgres error — syntax, unknown
        column, timeout) are returned verbatim in `error`: this is a
        debugging tool for a trusted, whitelisted admin, not a public
        surface, so hiding SQL errors would make it useless.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, description: Single SELECT or WITH...SELECT statement. }
      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AdminQueryResult' }
                  error: { type: string, nullable: true }
        '400':
          description: Query rejected by guard (not a single SELECT, multi-statement, forbidden keyword) or a real Postgres error (syntax, unknown column, timeout).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---- Telemetry: distribution (Phase 2) ----

  /telemetry/heartbeat:
    post:
      tags: [Telemetry]
      summary: Report one PWA install/version heartbeat
      description: >
        core/telemetry. Called by klay-app (owner + operator apps; entry has
        no authenticated session so it never calls this) once per session
        boot plus occasionally while active. Upserts app_installs keyed on
        (business_id, app, device_id) — business_id comes from the
        authenticated JWT claim, NOT from the request body, so a client
        can't report installs against a merchant it doesn't belong to.
        device_id is a client-generated pseudonymous fingerprint
        (crypto.randomUUID(), persisted in localStorage) — never a real
        device or personal identifier. No transaction/order data travels
        this path. Best-effort on the client: failures are swallowed there,
        never surfaced to the user.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeartbeatRequest' }
      responses:
        '200':
          description: Heartbeat recorded (insert or upsert)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleSuccess' }
        '400':
          description: Invalid body (app is not one of entry/owner/operator, empty app_version/device_id)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/distribution:
    get:
      tags: [Admin]
      summary: Aggregated PWA distribution stats for the admin panel
      description: >
        core/telemetry. Powers klay-admin's Distribution page. JWT
        RequireAdmin only — same pattern as /admin/query, no X-Admin-Key
        required. Returns total installs, breakdown by app, breakdown by
        app version, breakdown by merchant, and a list of devices that
        haven't reported in `stale_after_days` days (churn/uninstall
        signal, capped at 100 rows).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: app, in: query, schema: { type: string, enum: [entry, owner, operator] }, description: Filter by app. }
        - { name: business_id, in: query, schema: { type: string, format: uuid }, description: Filter by merchant. }
      responses:
        '200':
          description: Aggregated distribution stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/DistributionSummary' }
                  error: { type: string, nullable: true }
        '400':
          description: business_id query param is not a valid uuid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ============================================================
# COMPONENTS
# ============================================================

components:
  # x-klay-flag (vendor extension, may appear on any operation or schema):
  #   x-klay-flag:
  #     kind: suspected-bug | not-implemented | undocumented
  #     note: "<short human explanation>"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ---- Auth ----

    AuthSuccess:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            access_token: { type: string }
        error: { type: string, nullable: true }

    # ---- User (owner) ----

    UserWithBusiness:
      type: object
      properties:
        id: { type: string }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role: { type: string, description: Diisi dari token (mis. owner). }
        business: { $ref: '#/components/schemas/Business' }

    # ---- Admin user ----

    AdminUser:
      type: object
      description: >
        core/adminauth AdminInfo. No id: admin has no DB identity row —
        whitelist is ADMIN_WHITELIST_EMAILS (env var), and email is both the
        JWT subject and the client-facing identifier. email/full_name come
        straight from the verified Google profile at login time.
      properties:
        email: { type: string, format: email }
        full_name: { type: string }

    # ---- Business ----

    PlanEnum:
      type: string
      enum: [normal, enterprise, white_label, max]
      description: >
        normal = subs default. enterprise = larger model + custom config.
        white_label = custom branding. max = semua fitur unlocked + UI treatment khusus.

    BusinessStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, CHURNED]

    Business:
      type: object
      description: >
        Bentuk Business yang dikembalikan handler /business (user domain).
        Field set diverifikasi terhadap businessResponse di user/model.go.
      properties:
        id: { type: string, format: uuid }
        klay_id: { type: string, description: Identifier merchant (KL-...). }
        business_name: { type: string }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true }
        xendit_status: { type: string, description: Status onboarding/akun Xendit merchant. }
        qris_string:
          type: string
          nullable: true
          description: QRIS static payload milik merchant. Single per business.
        category: { type: string, nullable: true }

    BusinessLite:
      type: object
      description: Bentuk ringkas Business yang dikirim ke PWA operator (operator gak butuh tau plan/features detail).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        qris_static_payload: { type: string, nullable: true }

    BusinessAdminView:
      allOf:
        - $ref: '#/components/schemas/Business'
        - type: object
          description: >
            Admin-scoped business view. Admin-only fields (plan, status,
            quota, lifecycle timestamps) live here, not on the owner-facing
            Business schema. Reconciled separately in the Admin domain task.
          properties:
            owner_name: { type: string, description: Snapshot dari User saat onboarding. }
            owner_id: { type: string, format: uuid, description: Relasi ke User }
            plan: { $ref: '#/components/schemas/PlanEnum' }
            features:
              type: array
              items: { type: string }
              description: Feature flags. Placeholder MVP.
            max_operators: { type: integer, description: -1 = unlimited }
            is_premium_user: { type: boolean }
            status: { $ref: '#/components/schemas/BusinessStatus' }
            onboarded_at: { type: string, format: date-time, nullable: true }
            suspended_at: { type: string, format: date-time, nullable: true }
            churned_at: { type: string, format: date-time, nullable: true }
            last_active_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            onboarded_by: { type: string, format: uuid, nullable: true, description: Admin yang onboard, audit }
            onboard_notes: { type: string, nullable: true, description: Catatan deal-deal-an offline-first }

    # ---- Operator ----

    Operator:
      type: object
      description: Bentuk operator aman dikirim ke client. Tidak include password_hash atau qr_token.
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        name: { type: string }
        operator_code: { type: string, description: Server-generated (KL-XXXXX), unik per-business }
        is_active: { type: boolean }
        has_active_session: { type: boolean, description: Computed; true bila ada refresh token valid. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OperatorWithSecret:
      allOf:
        - $ref: '#/components/schemas/Operator'
        - type: object
          properties:
            qr_token:
              type: string
              description: Token statis url-safe base64. Hanya dikembalikan saat create, rotate, dan regenerate.
            pin:
              type: string
              description: PIN 6 digit. Hanya dikembalikan satu kali (one-time) saat create/rotate/regenerate.

    OperatorLoginResponse:
      type: object
      properties:
        access_token: { type: string, description: JWT scope=operator dengan claim operator_id + business_id }
        operator: { $ref: '#/components/schemas/Operator' }
        business: { $ref: '#/components/schemas/BusinessLite' }

    # ---- Product ----

    RecipeIngredient:
      type: object
      description: Satu bahan dalam recipe produk. Structured biar mesin bisa aggregate untuk consumption_log.
      x-klay-flag:
        kind: suspected-bug
        note: "Schema tidak dipakai oleh product API. product/model.go Product TIDAK punya field recipe, dan CreateProductRequest/UpdateProductRequest tidak menerima recipe. RecipeIngredient dipertahankan hanya sebagai referensi domain consumption-tracking; tidak ada endpoint product yang mengembalikan atau menerimanya."
      required: [name, qty, unit]
      properties:
        name:
          type: string
          description: Identifier bahan, snake_case (gula_aren, susu_uht, kopi_bubuk)
        qty:
          type: number
          description: Jumlah per 1 unit produk
        unit:
          type: string
          enum: [ml, l, g, kg, pcs]
          description: Satuan ukur

    Product:
      type: object
      description: >
        Representasi satu baris tabel products, direkonsiliasi ke product/model.go.
        Tidak ada nested recipe — Product struct tidak punya field recipe.
      x-klay-flag:
        kind: suspected-bug
        note: "Product has no recipe field in product/model.go; consumption tracking depends on a recipe the product API does not expose."
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        name: { type: string }
        price: { type: integer, format: int64, description: IDR integer, no decimal (int64) }
        category: { type: string, nullable: true }
        description: { type: string, nullable: true, description: Teks bebas, marketing copy }
        is_available: { type: boolean, description: Operator hide produk yang lagi habis }
        total_sold: { type: integer, description: Total unit CONFIRMED, untuk sort popular }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateProductRequest:
      type: object
      description: >
        Body POST /products (product/model.go CreateProductRequest).
        Tidak ada field recipe. business_id berasal dari JWT, bukan body.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        price: { type: integer, format: int64, minimum: 0, description: IDR integer; default 0 kalau tidak dikirim }
        category: { type: string, nullable: true, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 2000 }
        is_available: { type: boolean, nullable: true, description: Pointer di Go; nil = pakai default service }

    UpdateProductRequest:
      type: object
      description: >
        Body PATCH /products/{product_id} (product/model.go UpdateProductRequest).
        Semua field optional (pointer) — partial update. Tidak ada field recipe.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        price: { type: integer, format: int64, minimum: 0 }
        category: { type: string, nullable: true, minLength: 1, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 2000 }
        is_available: { type: boolean, nullable: true }

    ProductInput:
      type: object
      description: >
        Legacy schema (sebelum reconciliation). Dipertahankan untuk referensi.
        Gunakan AdminCreateProductRequest / AdminUpdateProductRequest untuk admin endpoints.
      required: [name, price]
      properties:
        name: { type: string }
        price: { type: integer }
        category: { type: string, nullable: true }
        description: { type: string, nullable: true }
        recipe:
          type: array
          items: { $ref: '#/components/schemas/RecipeIngredient' }
        is_available: { type: boolean, default: true }

    # ---- Admin Owner schemas ----

    CreateBusinessRequest:
      type: object
      description: Body POST /admin/owners. Matches admin/model.go CreateBusinessRequest.
      required: [email, password, full_name, business_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 6 }
        full_name: { type: string, minLength: 1, maxLength: 255 }
        business_name: { type: string, minLength: 1, maxLength: 255 }
        phone: { type: string, nullable: true, maxLength: 32 }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true, maxLength: 100 }
        country: { type: string, nullable: true, maxLength: 100 }

    UpdateBusinessRequest:
      type: object
      description: Body PATCH /admin/owners/{owner_id}. Matches admin/model.go UpdateBusinessRequest. Semua field optional.
      properties:
        business_name: { type: string, nullable: true, minLength: 1, maxLength: 255 }
        phone: { type: string, nullable: true, maxLength: 32 }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true, maxLength: 100 }
        country: { type: string, nullable: true, maxLength: 100 }
        merchant_status:
          type: string
          nullable: true
          enum: [PENDING, REGISTERED, ACTIVE, SUSPENDED]
          description: Status merchant lifecycle.

    OwnerSummary:
      type: object
      description: Satu baris di list owners. Matches admin/model.go OwnerSummary.
      properties:
        business_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        klay_id: { type: string, description: "Identifier merchant (KL-...)" }
        email: { type: string, format: email }
        full_name: { type: string }
        business_name: { type: string }
        merchant_status: { type: string }
        is_active: { type: boolean }
        is_suspended: { type: boolean }
        created_at: { type: string, format: date-time }

    OwnerDetail:
      type: object
      description: Detail owner termasuk field kontak. Matches admin/model.go OwnerDetail.
      properties:
        business_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        klay_id: { type: string }
        email: { type: string, format: email }
        full_name: { type: string }
        business_name: { type: string }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true }
        qris_string: { type: string, nullable: true }
        merchant_status: { type: string }
        is_active: { type: boolean }
        is_suspended: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OwnerListResult:
      type: object
      description: Response GET /admin/owners. Matches admin/model.go OwnerListResult.
      properties:
        owners:
          type: array
          items: { $ref: '#/components/schemas/OwnerSummary' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    # ---- Admin Product schemas ----

    Ingredient:
      type: object
      description: Satu bahan dalam recipe produk. Matches admin/model.go Ingredient.
      required: [name, qty, unit]
      properties:
        name: { type: string, description: Nama bahan }
        qty: { type: number, format: float, description: Jumlah per 1 unit produk }
        unit: { type: string, description: "Satuan ukur (ml, l, g, kg, pcs, dll)" }

    AdminProduct:
      type: object
      description: >
        Produk admin tanpa recipe. Matches admin/model.go AdminProduct.
        recipe TIDAK ada di list item — hanya tersedia di AdminProductDetail (GET single).
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        name: { type: string }
        price: { type: integer, format: int64, description: IDR integer }
        category: { type: string, nullable: true }
        description: { type: string, nullable: true }
        is_available: { type: boolean }
        total_sold: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminProductDetail:
      allOf:
        - $ref: '#/components/schemas/AdminProduct'
        - type: object
          description: AdminProduct + recipe array. Matches admin/model.go AdminProductDetail.
          properties:
            recipe:
              type: array
              items: { $ref: '#/components/schemas/Ingredient' }
              description: Daftar ingredient. Array kosong jika recipe belum diset.

    AdminCreateProductRequest:
      type: object
      description: Body POST /admin/owners/{owner_id}/products. Matches admin/model.go AdminCreateProductRequest.
      required: [name]
      properties:
        name: { type: string }
        price: { type: integer, format: int64, minimum: 0, description: IDR integer; default 0 }
        category: { type: string, nullable: true }
        description: { type: string, nullable: true }
        is_available: { type: boolean, nullable: true, description: Pointer di Go; nil = server default }

    AdminUpdateProductRequest:
      type: object
      description: Body PATCH /admin/products/{product_id}. Matches admin/model.go AdminUpdateProductRequest. Semua field optional.
      properties:
        name: { type: string, nullable: true }
        price: { type: integer, format: int64, minimum: 0, nullable: true }
        category: { type: string, nullable: true }
        description: { type: string, nullable: true }
        is_available: { type: boolean, nullable: true }

    # ---- Admin Transaction schemas ----

    AdminTransaction:
      type: object
      description: Satu transaksi di view admin. Matches admin/model.go AdminTransaction.
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        operator_id: { type: string, format: uuid, nullable: true }
        order_id: { type: string, description: "Format KLAY-YYYYMMDD-xxxx" }
        total_amount: { type: integer, format: int64, description: IDR integer }
        payment_method: { type: string, nullable: true, description: Null sebelum CONFIRMED }
        status: { type: string, description: DRAFT | PENDING | CONFIRMED | VOIDED }
        note: { type: string, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminListTransactionsResult:
      type: object
      description: Response GET /admin/transactions. Matches admin/model.go AdminListTransactionsResult.
      properties:
        transactions:
          type: array
          items: { $ref: '#/components/schemas/AdminTransaction' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    # ---- Admin: SQL console ----

    AdminQueryResult:
      type: object
      description: >
        Response POST /admin/query. Matches core/adminquery QueryResult.
        Generic on purpose — columns/rows shape depends entirely on
        whatever SELECT was submitted, so the frontend renders it as a
        plain dynamic table.
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: {}
            description: One row, values in the same order as `columns`. Values are strings, numbers, booleans, or null — never base64/binary.
        row_count: { type: integer }

    # ---- Telemetry: distribution (Phase 2) ----

    HeartbeatRequest:
      type: object
      description: Body POST /telemetry/heartbeat. Matches core/telemetry HeartbeatRequest. business_id comes from the JWT, not this body.
      required: [app, app_version, device_id]
      properties:
        app: { type: string, enum: [entry, owner, operator] }
        app_version: { type: string, maxLength: 50, description: "Build version, e.g. from package.json via a Vite define()." }
        device_id: { type: string, maxLength: 100, description: "Client-generated pseudonymous fingerprint (crypto.randomUUID()), persisted in localStorage." }

    AppTotal:
      type: object
      properties:
        app: { type: string }
        count: { type: integer }

    VersionBreakdown:
      type: object
      properties:
        app: { type: string }
        app_version: { type: string }
        count: { type: integer }

    MerchantBreakdown:
      type: object
      properties:
        business_id: { type: string, format: uuid }
        business_name: { type: string }
        entry: { type: integer }
        owner: { type: integer }
        operator: { type: integer }
        total: { type: integer }

    StaleDevice:
      type: object
      description: A device that hasn't sent a heartbeat in `stale_after_days` days — churn/uninstall signal.
      properties:
        business_id: { type: string, format: uuid }
        business_name: { type: string }
        app: { type: string }
        app_version: { type: string }
        last_seen_at: { type: string, format: date-time }

    DistributionSummary:
      type: object
      description: Response GET /admin/distribution. Matches core/telemetry DistributionSummary.
      properties:
        total_installs: { type: integer }
        by_app:
          type: array
          items: { $ref: '#/components/schemas/AppTotal' }
        by_version:
          type: array
          items: { $ref: '#/components/schemas/VersionBreakdown' }
        by_merchant:
          type: array
          items: { $ref: '#/components/schemas/MerchantBreakdown' }
        stale_devices:
          type: array
          items: { $ref: '#/components/schemas/StaleDevice' }
          description: Capped at 100 rows.
        stale_after_days: { type: integer }

    # ---- Transaction ----

    TransactionStatus:
      type: string
      enum: [DRAFT, CONFIRMED, VOIDED]
      description: >
        DRAFT = order sedang diisi operator (default saat create).
        CONFIRMED = pembayaran dikonfirmasi.
        VOIDED = dibatalkan.
        Catatan: PENDING ADA sebagai state internal order (DRAFT -> PENDING ->
        CONFIRMED via begin/confirm checkout), tetapi DITOLAK oleh validasi filter
        list transaksi (transaction/handler.go), jadi enum filter ini tidak memuatnya.
      x-klay-flag:
        kind: suspected-bug
        note: "Code rejects PENDING (transaction/handler.go list-filter validation). Prior contract listed PENDING as a state. PENDING masih valid sebagai status order tersimpan, hanya tidak bisa dipakai sebagai nilai filter list."

    PaymentMethod:
      type: string
      enum: [CASH, QRIS_STATIC, TRANSFER]
      description: >
        CASH = tunai. QRIS_STATIC = pembayaran via QRIS merchant static
        (operator konfirmasi manual). TRANSFER = transfer rekening (operator cek manual).
        Dynamic QRIS via gateway = roadmap post-MVP.

    Transaction:
      type: object
      description: >
        Field-set direkonsiliasi ke order/model.go + transaction/model.go.
        Mewakili satu baris orders. operator_name + item_count hanya di-set oleh
        endpoint List (computed, bukan kolom langsung).
      properties:
        id: { type: string, format: uuid }
        business_id: { type: string, format: uuid }
        operator_id: { type: string, format: uuid, nullable: true, description: Operator yang bikin order; null kalau owner langsung. (Sebelumnya salah dinamai created_by_operator_id.) }
        order_id: { type: string, description: Format KLAY-YYYYMMDD-xxxx, ditampilkan ke operator/owner }
        total_amount: { type: integer, description: Sum dari items.subtotal, IDR integer }
        payment_method: { allOf: [{ $ref: '#/components/schemas/PaymentMethod' }], nullable: true, description: Null sebelum confirm, di-set saat CONFIRMED }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        note: { type: string, nullable: true }
        checkout_started_at: { type: string, format: date-time, nullable: true, description: Di-stamp saat begin-checkout (hanya ada di order/model.go, bukan transaction/model.go) }
        confirmed_at: { type: string, format: date-time, nullable: true }
        confirmed_by:
          type: string
          nullable: true
          description: Siapa yang konfirmasi (string bebas). Null sebelum confirm.
          x-klay-flag:
            kind: suspected-bug
            note: "confirmed_by is a bare string in order/model.go; prior contract modelled it as {type,id}. Auditor identity is not structured."
        voided_at: { type: string, format: date-time, nullable: true }
        void_reason: { type: string, nullable: true, description: "Diisi pada owner void. Operator void (POST /orders/:id/void) tidak menerima body sehingga tidak mengisi field ini." }
        operator_name: { type: string, nullable: true, description: Computed; di-set hanya oleh GET /transactions List. }
        item_count: { type: integer, description: Computed; di-set hanya oleh GET /transactions List. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      # NOTE: voided_by DIHAPUS — tidak ada di order/model.go maupun transaction/model.go.
      # Identitas pem-void tidak dipersist sebagai kolom; hanya voided_at + void_reason yang tersimpan.

    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TransactionItem' }

    TransactionItem:
      type: object
      description: Snapshot field. product_name dan unit_price di-freeze saat order dibuat agar histori akurat walau produk di-edit/delete kemudian.
      properties:
        id: { type: string, format: uuid, description: ID baris order_items }
        product_id: { type: string, format: uuid, nullable: true, description: Null kalau produk sumber sudah dihapus }
        product_name: { type: string, description: Snapshot saat transaksi dibuat }
        unit_price: { type: integer, description: Snapshot harga satuan saat transaksi dibuat, IDR integer }
        quantity: { type: integer }
        subtotal: { type: integer, description: unit_price * quantity }

    # ---- Dashboard ----

    DashboardSummary:
      type: object
      properties:
        period: { type: string }
        total_revenue: { type: integer, description: Sum total_amount status CONFIRMED }
        total_transactions: { type: integer, description: Count status CONFIRMED }
        total_pending: { type: integer, description: Count status PENDING saat ini }
        total_voided: { type: integer, description: Count status VOIDED }
        avg_transaction_value: { type: integer }
        revenue_change_pct: { type: number, format: float, description: vs periode sebelumnya }
        transaction_change_pct: { type: number, format: float }

    DailyTrend:
      type: object
      properties:
        date: { type: string, format: date }
        total_transactions: { type: integer }
        total_revenue: { type: integer }

    TopProduct:
      type: object
      properties:
        product_id: { type: string }
        product_name: { type: string }
        total_sold: { type: integer }
        total_revenue: { type: integer }
        category: { type: string, nullable: true }

    HourlyDistribution:
      type: object
      properties:
        hour: { type: integer, description: 0-23 }
        total_transactions: { type: integer }
        avg_transactions: { type: number, format: float }

    # ---- Analytics ----

    AnalyticsOverview:
      type: object
      properties:
        current_period:
          type: object
          properties:
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            total_revenue: { type: integer }
            total_transactions: { type: integer }
            avg_transaction_value: { type: integer }
            daily_breakdown:
              type: array
              items: { $ref: '#/components/schemas/DailyTrend' }
        comparison:
          type: object
          nullable: true
          description: Null kalau compare_with == none
          properties:
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            total_revenue: { type: integer }
            total_transactions: { type: integer }
            revenue_change_pct: { type: number, format: float }
            transaction_change_pct: { type: number, format: float }

    # ---- Report ----

    DailySalesReport:
      type: object
      properties:
        date: { type: string, format: date }
        business_id: { type: string, format: uuid }
        total_revenue: { type: integer }
        total_transactions: { type: integer }
        breakdown_by_method:
          type: array
          items:
            type: object
            properties:
              method: { $ref: '#/components/schemas/PaymentMethod' }
              count: { type: integer }
              revenue: { type: integer }
        breakdown_by_product:
          type: array
          items: { $ref: '#/components/schemas/TopProduct' }

    MonthlySalesReport:
      type: object
      properties:
        month: { type: string, description: Format YYYY-MM }
        business_id: { type: string, format: uuid }
        total_revenue: { type: integer }
        total_transactions: { type: integer }
        daily_breakdown:
          type: array
          items: { $ref: '#/components/schemas/DailyTrend' }
        breakdown_by_method:
          type: array
          items:
            type: object
            properties:
              method: { $ref: '#/components/schemas/PaymentMethod' }
              count: { type: integer }
              revenue: { type: integer }
        breakdown_by_product:
          type: array
          items: { $ref: '#/components/schemas/TopProduct' }

    ConsumptionEntry:
      type: object
      properties:
        ingredient_name: { type: string }
        total_qty: { type: number }
        unit: { type: string }
        used_in_products:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string }
              product_name: { type: string }
              qty_consumed: { type: number }

    ConsumptionReport:
      type: object
      properties:
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        business_id: { type: string, format: uuid }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ConsumptionEntry' }

    # ---- Insight ----

    InsightCard:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [trend, warning, opportunity, consumption]
          description: consumption type baru untuk insight dari resource usage
        title: { type: string, description: Maks 10 kata }
        narrative: { type: string, description: 1-2 kalimat natural }
        source_data_window:
          type: object
          description: Periode data yang generate insight ini
          properties:
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
        model_version: { type: string, default: rule-v1, description: Forward-compat untuk AI engine post-MVP }
        confidence_score: { type: number, format: float, nullable: true, description: Null di MVP rule-based, di-isi saat switch ke AI }
        updated_at: { type: string, format: date-time }

    # ---- Shared ----

    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }

    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { type: string, nullable: true, example: null }
        error: { type: string }

    # ---- System ----

    HealthStatus:
      type: object
      description: GET /health response — not wrapped in the {success,data,error} envelope, this is the raw body.
      properties:
        status: { type: string, enum: [ok, degraded] }
        timestamp: { type: string, format: date-time }
        uptime_seconds: { type: integer, description: Process uptime, not server/container uptime. }
        checks:
          type: object
          properties:
            database:
              type: object
              properties:
                status: { type: string, enum: [up, down] }
                latency_ms: { type: integer }
            redis:
              type: object
              description: Always not_configured — Redis isn't wired into the app yet (docs/redis-caching-plan.md).
              properties:
                status: { type: string, enum: [not_configured] }

    SimpleSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: string, nullable: true, example: null }
        error: { type: string, nullable: true }

  responses:
    Unauthorized:
      description: Access token tidak valid atau tidak ada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    Forbidden:
      description: Role tidak punya akses ke resource ini
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    BadRequest:
      description: Input tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }