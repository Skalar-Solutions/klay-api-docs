        kind: undocumented
        note: "Owner-facing product CRUD exists at /products in routes.go; prior contract said admin-only."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Product' }
                  error: { type: string, nullable: true }
        '400':
          description: Invalid request body or validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /products/{product_id}:
    parameters:
      - { name: product_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Product]
      summary: Get product details
      description: Owner & operator (RequireOperator).
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Product details
