openapi: 3.0.3

# ============================================================
# KLAY-API CONTRACT v0.8 — TELEMETRY DISTRIBUTION (Phase 2)
# Added: POST /telemetry/heartbeat (owner/operator session, ingest),
# GET /admin/distribution (admin JWT, aggregate read). New core/telemetry
# domain, new app_installs table (migration 020). No existing endpoint
# changed.
# ============================================================
# KLAY-API CONTRACT v0.7 — SERVER FIXES APPLIED (2026-06-24)
# Breaking changes: /kasir/auth/* → /operator/auth/*, /orders/sessions removed.
# ============================================================
# This version was reconciled endpoint-by-endpoint against the Go
# implementation in klay-server/apps/api/core/. Where the code and the
# prior contract disagreed, the CODE is authoritative. Behaviour that
# looks like a bug or unfinished work is documented as-is and marked with
# the `x-klay-flag` vendor extension (kind: suspected-bug | not-implemented
# | undocumented) so it renders as a warning badge in the docs.
# ============================================================

# ============================================================
# KLAY-API CONTRACT v0.5
# ============================================================
# Major changes from v0.4:
#  - Order domain: /pos/orders/* renamed to /orders/*, /pos/sessions -> /orders/sessions
#  - Metrics domain: /dashboard/*, /analytics/*, /reports/*, /insight -> /metrics/*
#  - Bug fix: dashboard/report queries used status='paid' (invalid). Fixed to 'CONFIRMED'.
#  - Tags: Dashboard/Analytics/Report/Insight merged into Metrics; POS tag renamed to Order.
#  - Table renames in migration 014: pos_orders->orders, pos_order_items->order_items,
#    pos_sessions->order_sessions, FK column pos_order_id->order_id.
#  - Request hardening: BodyLimit 2M, Timeout 30s, IPExtractor XFF.
#  - Rate limiting: per-scope per user_id (Owner 100/min, Operator 60/min, Admin 200/min).
# ============================================================
# Major changes from v0.3:
#  - Xendit DROPPED. Full in-house transaction management.
#  - Order/transaction status flow: DRAFT -> PENDING -> CONFIRMED (via begin/confirm
#    checkout), with VOIDED as a terminal branch. NOTE: PENDING exists as a stored
#    order status but is REJECTED by the /transactions list-filter validation
#    (transaction/handler.go), so the TransactionStatus filter enum is [DRAFT, CONFIRMED, VOIDED].
#  - 3 payment methods MVP: CASH, QRIS_STATIC, TRANSFER
#  - Manual confirmation by operator via slide-to-confirm gesture (>=800ms)
#  - RECONCILED: Product struct has NO recipe field (product/model.go); RecipeIngredient
#    schema is unused by the product API. Consumption tracking has no product-side source.
#  - RECONCILED: Owner-facing Product CRUD lives at /products (POST/PATCH/DELETE,
#    RequireOwner); GET is owner+operator (RequireOperator). Not admin-only.
#    GET /products wraps data as { products: [...] }. Admin /admin*/products is separate.
#  - Admin domain added (Skalar staff onboarding + management surface)
#  - Plan + features merged into Business (no separate Plans/Subs tables)
#  - Business lifecycle tracking: enum status + event timestamps
#  - Report domain added (daily/monthly sales, consumption, export)
#  - No public registration. Onboarding offline-first via admin Skalar.
#  - Auto-forward WA/Telegram add-on deferred (post-MVP)
# ============================================================

info:
  title: Klay API
  description: >
    API contract between client (Next.js dashboard + separate operator PWA) and
    server (Go + Echo) for the Klay platform.
    Klay is a business intelligence layer for SMBs with in-house
    transaction management. Three primary roles: owner (dashboard access),
    operator (operator PWA access), and admin (Skalar staff, admin panel access).
  version: 0.8.1
  contact:
    name: Klay Development Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.klay.id
    description: Production

# ============================================================
# PATHS
# ============================================================

paths:

  # ==========================================================
  # SYSTEM
  # ==========================================================

  /health:
    get:
      tags: [System]
      summary: Server health status (for the monitoring card in the admin panel)
      description: >
        cmd/main.go. Public, no auth — deliberately lightweight (2s DB ping
        timeout) so it's safe to poll every few seconds. Returns HTTP 200
        when status=ok, HTTP 503 when status=degraded (mirrors the existing
        /readyz convention). Redis isn't wired into the app yet (see
        docs/redis-caching-plan.md) — checks.redis always reports
        not_configured rather than opening a new connection just for this
        endpoint.
      responses:
        '200':
          description: Server healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: One or more dependencies down (e.g. database unreachable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  # ==========================================================
  # AUTH (OWNER)
  # ==========================================================
  # Owner login flow. Email/password atau Google OAuth.
  # Refresh token disimpan di httpOnly cookie.
  # No public registration. Owner di-onboard tim Skalar.
  # ==========================================================

  /auth/login:
    post:
      tags: [Auth]
      summary: Owner login with identifier and password
      description: >
        Authenticate owner via identifier (email OR klay_id) + password.
        Account must have been created by Skalar admin during onboarding.
        Success = access token in body, refresh token in httpOnly cookie.
        Response data contains only access_token (no nested user object).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Owner's email or klay_id.
                password: { type: string, format: password }
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: Refresh token httpOnly cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Account found but business status is SUSPENDED or CHURNED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/google/login:
    post:
      tags: [Auth]
      summary: Owner login with Google OAuth (NOT IMPLEMENTED)
      description: >
        Handler currently returns 501 Not Implemented (auth/handler.go
        GoogleLogin). Google OAuth login is not yet wired. The 200/403 entries
        below are the intended contract but not yet built: called by NextAuth
        after Google OAuth succeeds, server verifies the email is registered as
        an owner, then issues its own Klay JWT.
      x-klay-flag:
        kind: not-implemented
        note: "Handler returns 501 Not Implemented (auth/handler.go). Google OAuth login is not wired yet."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string, format: email }
                name: { type: string }
      responses:
        '200':
          description: "[INTENDED, NOT YET BUILT] Login successful"
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSuccess' }
        '403':
          description: "[INTENDED, NOT YET BUILT] Email not registered as an owner"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '501':
          description: Google login not implemented (actual server behavior)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Reads refresh token from httpOnly cookie, issues a new access token.
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                  error: { type: string, nullable: true }
        '401':
          description: Refresh token invalid or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Clears the refresh token httpOnly cookie.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==========================================================
  # USER (OWNER PROFILE)
  # ==========================================================

  /users/me:
    get:
      tags: [User]
      summary: Profile of the currently authenticated owner
      description: Returns the owner's profile along with associated business data.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/UserWithBusiness' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

    patch:
      tags: [User]
      summary: Update owner profile
      description: >
        Owner can update name or phone. Email cannot be changed (Skalar admin only).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                phone: { type: string }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/UserWithBusiness' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==========================================================
  # BUSINESS
  # ==========================================================
  # Owner endpoint untuk lihat dan update business info terbatas.
  # Plan, features, max_operators, status — hanya admin Skalar yang bisa ubah.
  # ==========================================================

  /business:
    get:
      tags: [Business]
      summary: Business details for the authenticated owner
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Business data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Business' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

    patch:
      tags: [Business]
      summary: Update business info (restricted)
      description: >
        Owner can only update display fields. Plan, features,
        max_operators, status, and xendit_status are Skalar admin-only fields.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                business_name: { type: string }
                phone: { type: string }
                address: { type: string }
                city: { type: string }
                country: { type: string }
                qris_string: { type: string, description: "Merchant QRIS static payload." }
                category: { type: string }
      responses:
        '200':
          description: Business updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Business' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==========================================================
  # OPERATOR (DASHBOARD MANAGEMENT)
  # ==========================================================
  # Owner manage operator dari dashboard.
  # Admin Skalar hanya bisa REMOVE operator on request (di admin domain).
  # ==========================================================

  /business/operators:
    get:
      tags: [Operator]
      summary: List business operators
      description: >
        Lists operators with quota info. qr_token is not returned in the list —
        only on create and regenerate.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Operator list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      operators:
                        type: array
                        items: { $ref: '#/components/schemas/Operator' }
                      slot_used: { type: integer }
                      slot_max:
                        type: integer
                        description: -1 = unlimited
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Operator]
      summary: Add a new operator
      description: >
        Owner-only. Cap is validated against business.max_operators
        (default 3, admin updates if add-on purchased, -1 = unlimited).
        Body contains only name; server generates operator_code (KL-XXXXX),
        PIN, and qr_token. operator_code and credentials (qr_token/pin)
        are returned only in this create/regenerate response (one-time).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Siti Kasir
                  description: >
                    The only input field. Server generates operator_code
                    and credentials, returned in the response.
      responses:
        '201':
          description: Operator created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/OperatorWithSecret' }
                  error: { type: string, nullable: true }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: operator_code already in use or slot limit reached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /business/operators/{operator_id}:
    parameters:
      - { name: operator_id, in: path, required: true, schema: { type: string, format: uuid } }

    get:
      tags: [Operator]
      summary: Get a single operator
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Operator found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Operator' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Operator]
      summary: Update operator (partial)
      description: Owner updates name or is_active. Password and QR reset are handled by separate endpoints.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                is_active: { type: boolean }
      responses:
        '200':
          description: Operator updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Operator' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Operator]
      summary: Delete operator (soft delete)
      description: >
        Soft delete — deleted_at is set, row remains. operator_code is NOT released
        (stored in row, unique index slot consumed). Operator can no longer log in.
        Active operator slot count decreases (COUNT is_active drops). Historical data remains valid.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Operator deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleSuccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /business/operators/{operator_id}/regenerate-qr:
    post:
      tags: [Operator]
      summary: Regenerate operator qr_token
      description: >
        Issues a new qr_token. The old QR is invalid for new logins, but
        any currently active JWT sessions remain valid until the access token expires.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: operator_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: New QR token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/OperatorWithSecret' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /business/operators/{operator_id}/qr:
    get:
      tags: [Operator]
      summary: Get operator_code and qr_token
      description: >
        Owner-only. Returns the current operator_code and qr_token
        to re-render the QR in the dashboard without regenerating.
      security: [{ BearerAuth: [] }]
      x-klay-flag:
        kind: undocumented
        note: "Present in user/routes.go, absent from prior contract."
      parameters:
        - { name: operator_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: operator_code and qr_token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      operator_code: { type: string }
                      qr_token: { type: string }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /business/operators/{operator_id}/rotate:
    post:
      tags: [Operator]
      summary: Rotate operator credentials
      description: >
        Owner-only. Re-issues the operator's qr_token and PIN. New credentials
        are returned only once (one-time) in this response.
      security: [{ BearerAuth: [] }]
      x-klay-flag:
        kind: undocumented
        note: "Present in user/routes.go, absent from prior contract."
      parameters:
        - { name: operator_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Operator credentials rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/OperatorWithSecret' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /business/operators/{operator_id}/force-logout:
    post:
      tags: [Operator]
      summary: Force logout operator
      description: >
        Owner-only. Revokes the operator's active session (revoke refresh token).
        Returns 204 No Content on success.
      security: [{ BearerAuth: [] }]
      x-klay-flag:
        kind: undocumented
        note: "Present in user/routes.go, absent from prior contract."
      parameters:
        - { name: operator_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Operator session revoked (no content)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================
  # OPERATOR AUTH (PWA LOGIN)
  # ==========================================================
  # PWA operator terpisah dari dashboard. Operator login via:
  #  - business_id + operator_code + pin (fallback)
  #  - qr_token (primary, faster)
  # JWT scope: "operator" (cannot hit owner/admin endpoints)
  # ==========================================================

  /operator/auth/login:
    post:
      tags: [Operator]
      summary: Operator login with credentials
      description: >
        Public endpoint. identifier (business email or klay_id) resolves
        the business; operator is looked up via operator_code + PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, operator_code, pin]
              properties:
                identifier:
                  type: string
                  description: Business email or klay_id (resolves business).
                operator_code: { type: string, minLength: 3, maxLength: 64 }
                pin: { type: string, format: password, minLength: 6, maxLength: 6, pattern: '^[0-9]{6}$', description: "Exactly 6 numeric digits (server: validate len=6,numeric)." }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/OperatorLoginResponse' }
                  error: { type: string, nullable: true }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Operator inactive or business is SUSPENDED/CHURNED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /operator/auth/login/qr:
    post:
      tags: [Operator]
      summary: Operator login with QR scan
      description: Public endpoint. qr_token is static, regenerated via owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/OperatorLoginResponse' }
                  error: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid qr_token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Operator inactive or business is SUSPENDED/CHURNED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /operator/me:
    get:
      tags: [Operator]
      summary: Profile of the currently authenticated operator (PWA)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Operator profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      operator: { $ref: '#/components/schemas/Operator' }
                      business: { $ref: '#/components/schemas/BusinessLite' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==========================================================
  # PRODUCT (OWNER READ-ONLY)
  # ==========================================================
  # Owner GET only. CRUD product ada di admin domain.
  # Recipe nested di product object (structured ingredients[]).
  # Owner submit perubahan produk = contact tim Skalar di luar sistem.
  # FE dashboard kasih info copy "Untuk edit produk, hubungi tim Skalar."
  # ==========================================================

  # ==========================================================
  # PRODUCT
  # ==========================================================
  # RECONCILED to Go source of truth (product/ package).
  #
  # routes.go: group "/products" wrapped by authMiddleware + RateLimitOwner.
  #   GET    /products              -> List    (RequireOperator) owner+operator read
  #   GET    /products/:product_id  -> GetByID (RequireOperator) owner+operator read
  #   POST   /products              -> Create  (RequireOwner)    owner-only write
  #   PATCH  /products/:product_id  -> Update  (RequireOwner)    owner-only write
  #   DELETE /products/:product_id  -> Delete  (RequireOwner)    owner-only write
  #
  # Owner-facing product CRUD lives HERE at /products, not under /admin.
  # Prior contract wrongly said product writes were admin-only.
  #
  # Shapes (product/handler.go):
  #   List    -> response.OK     => 200 { success, data: { products: [Product] }, error }
  #   GetByID -> response.OK      => 200 { success, data: Product, error }
  #   Create  -> response.Created => 201 { success, data: Product, error }
  #   Update  -> response.OK      => 200 { success, data: Product, error }
  #   Delete  -> response.NoContent => 200 { success:true } (NOT 204)
  #
  # NOTE: handler does not read category/q/sort/is_available query params;
  # service.List takes only businessID. Prior filter/sort params were fictional.
  # ==========================================================

  /products:
    get:
      tags: [Product]
      summary: List business products
      description: >
        Owner & operator (RequireOperator) can GET. Handler only uses business_id
        from JWT; no query filter/sort/search is processed by the server.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: "Product list (data wrapped as object { products: [...] })"
          content:
            application/json:
              schema:
