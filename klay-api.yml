    patch:
      tags: [Product]
      summary: Update product (owner only, partial)
      description: >
        RequireOwner. Partial update — fields not sent remain unchanged.
      security: [{ BearerAuth: [] }]
      x-klay-flag:
        kind: undocumented
        note: "Owner-facing product CRUD exists at /products in routes.go; prior contract said admin-only."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Product' }
