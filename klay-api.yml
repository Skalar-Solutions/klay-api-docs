        '400':
          description: Invalid request body or product_id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Product]
      summary: Delete product (owner only)
      description: RequireOwner.
      security: [{ BearerAuth: [] }]
      x-klay-flag:
        kind: undocumented
        note: "Owner-facing product CRUD exists at /products in routes.go; prior contract said admin-only."
      responses:
        '200':
          description: >
            Product deleted. response.NoContent() returns HTTP 200 with body
            { success: true }, NOT 204 No Content.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================
  # TRANSACTION
  # ==========================================================
  # RECONCILED to Go source of truth (order/ + transaction/ packages).
  #
  # Reality:
  #   - There is NO `POST /transactions` and NO `POST /transactions/{id}/confirm`.
  #     The create/checkout/void WRITE flow lives entirely under /orders
  #     (order/routes.go), plus an owner-scoped void at POST /transactions/{id}/void.
  #   - The /transactions GET endpoints are the READ-ONLY transaction log
  #     (transaction/routes.go); writes were moved to the /orders domain.
  #
  # Write flow (order/routes.go, RequireOperator):
  #   POST  /orders                            -> create DRAFT order
  #   PATCH /orders/{order_id}/items           -> replace items while DRAFT
  #   POST  /orders/{order_id}/checkout/begin  -> DRAFT -> PENDING (stamps checkout_started_at)
  #   POST  /orders/{order_id}/checkout/confirm -> -> CONFIRMED (body: payment_method)
  #   POST  /orders/{order_id}/void            -> operator void
  #
  # Owner void (order/routes.go, RequireOwner):
  #   POST  /transactions/{id}/void            -> handled by order.VoidOrderByOwner
  #
  # Read flow (transaction/routes.go):
  #   GET   /transactions                      -> List (RequireOwner)
  #   GET   /transactions/{transaction_id}     -> GetByID (RequireOperator)
  #   GET   /operator/transactions             -> OperatorList (RequireOperatorOnly)
  #
  # NOTE: response.NoContent() returns HTTP 200 with body {"success":true},
  # NOT 204 No Content. Void endpoints therefore return 200, not 204.
  # ==========================================================

  /orders:
    post:
      tags: [Transaction]
      summary: Create a new order (status DRAFT)
      description: >
        order.CreateOrder (RequireOperator). Initial status is DRAFT.
        Backend calculates total_amount from items and snapshots product_name +
        unit_price into order_items. operator_id is taken from JWT (nullable if owner).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                note: { type: string, nullable: true, maxLength: 500 }
      responses:
        '201':
          description: DRAFT order created (response.Created -> 201)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/TransactionDetail' }
                  error: { type: string, nullable: true }
        '400':
          description: Invalid body, empty items, or product not found/unavailable (ErrEmptyItems / ErrProductNotFound mapped to 400 BadRequest)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    get:
      tags: [Transaction]
      summary: List orders for the authenticated operator
      description: >
        order.ListMyOrders (RequireOperator). Only orders belonging to the operator from JWT.
        If called as owner (operator_id empty) returns an empty array.
        Response is a Transaction array directly in `data`, NOT a paginated object.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Operator's order array (or [] for owner)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/{order_id}/items:
    patch:
      tags: [Transaction]
      summary: Replace items in a DRAFT order
      description: order.UpdateItems (RequireOperator). Only valid when status is DRAFT.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: order_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                note: { type: string, nullable: true, maxLength: 500 }
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/TransactionDetail' }
                  error: { type: string, nullable: true }
        '400': { description: Invalid body or product not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Order is not in DRAFT status (ErrNotDraft)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{order_id}/checkout/begin:
    post:
      tags: [Transaction]
      summary: Begin checkout (DRAFT -> PENDING)
      description: >
        order.BeginCheckout (RequireOperator). Stamps checkout_started_at and moves
        status to PENDING. No request body. Must be called before confirm —
        confirming without begin yields ErrCheckoutNotStarted (400).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: order_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Checkout started, status PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/TransactionDetail' }
                  error: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Order is not in DRAFT status (ErrNotDraft)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{order_id}/checkout/confirm:
    post:
      tags: [Transaction]
      summary: Confirm checkout (PENDING -> CONFIRMED)
      description: >
        order.ConfirmCheckout (RequireOperator). Body requires `payment_method`.
        Server rejects if begin-checkout was not called (ErrCheckoutNotStarted)
        or gesture was too fast <800ms since checkout_started_at (ErrGestureTooFast).
        Stamps confirmed_at + confirmed_by (string), then triggers consumption_log
        from product.recipe. Response includes qris_string when payment is QRIS_STATIC.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: order_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method]
              properties:
                payment_method: { $ref: '#/components/schemas/PaymentMethod' }
      responses:
        '200':
          description: Order CONFIRMED. data = Order + qris_string (nullable, only for QRIS_STATIC).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Transaction'
                      - type: object
                        properties:
                          qris_string: { type: string, nullable: true, description: Populated only when payment_method = QRIS_STATIC }
                  error: { type: string, nullable: true }
        '400':
          description: Invalid body or checkout not started (ErrCheckoutNotStarted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Order is not PENDING (ErrNotPending) or confirmation too fast <800ms (ErrGestureTooFast)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/{order_id}/void:
    post:
      tags: [Transaction]
      summary: Void order (operator)
      description: >
        order.VoidOrder (RequireOperator). No request body. Returns
        response.NoContent = HTTP 200 with body {"success":true} (NOT 204).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: order_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Order voided. Body {"success":true} with no data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
          x-klay-flag:
            kind: suspected-bug
            note: "response.NoContent() returns 200 with {success:true}, not 204 No Content (pkg/response/response.go). Endpoint takes no request body, so void_reason is NOT captured on the operator void path."
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transactions/{id}/void:
    post:
      tags: [Transaction]
      summary: Void order (owner)
      description: >
        order.VoidOrderByOwner (RequireOwner). Write mutation in the order domain but
        mounted at /transactions/{id}/void. Body requires `void_reason`.
        Owner identity is taken from user_id JWT. Returns response.NoContent =
        HTTP 200 with {"success":true} (NOT 204).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [void_reason]
              properties:
                void_reason: { type: string, minLength: 1, maxLength: 500, description: Required for audit purposes }
      responses:
        '200':
          description: Order voided. Body {"success":true} with no data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
          x-klay-flag:
            kind: suspected-bug
            note: "response.NoContent() returns 200 with {success:true}, not 204 (pkg/response/response.go). Path lives under /transactions but the handler is order.VoidOrderByOwner."
        '400': { description: Empty void_reason or invalid body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transactions:
    get:
      tags: [Transaction]
      summary: Business transaction list (read-only log)
      description: >
        transaction.List (RequireOwner). Read-only history. status query accepts
        only DRAFT/CONFIRMED/VOIDED — PENDING is rejected 400 by list-filter validation.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: start_date, in: query, schema: { type: string, format: date }, description: Format YYYY-MM-DD }
        - { name: end_date, in: query, schema: { type: string, format: date }, description: Format YYYY-MM-DD }
        - name: status
          in: query
          description: "Only DRAFT, CONFIRMED, VOIDED accepted. PENDING rejected 400."
          schema: { type: string, enum: [DRAFT, CONFIRMED, VOIDED] }
        - { name: payment_method, in: query, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { name: operator_id, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
                      pagination: { $ref: '#/components/schemas/Pagination' }
                  error: { type: string, nullable: true }
        '400':
          description: Invalid filter (e.g. status=PENDING, invalid payment_method/date/page/limit)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /transactions/{transaction_id}:
    get:
      tags: [Transaction]
      summary: Transaction details
      description: >
        transaction.GetByID (RequireOperator). Returns OrderWithItems
        (Transaction + items[]).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: transaction_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/TransactionDetail' }
                  error: { type: string, nullable: true }
        '400': { description: Invalid transaction_id, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /operator/transactions:
    get:
      tags: [Transaction]
      summary: Transaction list for the authenticated operator
      description: >
        transaction.OperatorList (RequireOperatorOnly). Operator-scoped — only
        transactions from the operator in JWT. Filters: start_date, end_date, page, limit
        (no status/payment_method/operator_id filter on this endpoint).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: start_date, in: query, schema: { type: string, format: date }, description: Format YYYY-MM-DD }
        - { name: end_date, in: query, schema: { type: string, format: date }, description: Format YYYY-MM-DD }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Paginated operator transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
                      pagination: { $ref: '#/components/schemas/Pagination' }
                  error: { type: string, nullable: true }
        '400': { description: Invalid filter, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

